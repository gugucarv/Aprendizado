# Opções gerais do Gradle. Em arquivos .properties, comentários começam com "#".

# Memória máxima que o Gradle pode usar (2 GB) e codificação dos arquivos (UTF-8, para os acentos).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Usa as bibliotecas modernas do Android (AndroidX), como o AppCompat.
android.useAndroidX=true
# Segue o estilo oficial de formatação do Kotlin.
kotlin.code.style=official
# Cada módulo só enxerga os próprios recursos (R), deixando a compilação mais rápida.
android.nonTransitiveRClass=true
