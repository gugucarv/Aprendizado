# Compila o app Android "Cor Aleatória" e gera o APK para instalar no celular.
# Roda sozinho a cada envio (push) que mude a pasta CorAleatoria ou este arquivo,
# e também pode ser iniciado à mão pela aba Actions ("Run workflow").
name: Compilar app Android

# Título de cada build na lista do Actions: a primeira linha do commit.
run-name: "APK: ${{ github.event.head_commit.message || 'compilação manual' }}"

on:
  push:
    paths:
      - "CorAleatoria/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CorAleatoria
    steps:
      # 1. Baixa o código do repositório para a máquina do GitHub.
      - name: Baixar o código
        uses: actions/checkout@v4

      # 2. Instala o Java 17, que o Android precisa para compilar.
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Prepara o Gradle (ferramenta de compilação) e guarda cache
      #    para as próximas builds ficarem mais rápidas.
      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Compila o app e gera o APK de teste (debug).
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 5. Publica o APK na página da build, em "Artifacts", para baixar.
      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: CorAleatoria-apk
          path: CorAleatoria/app/build/outputs/apk/debug/app-debug.apk

      # 6. Escreve na página da build o que mudou nesta versão
      #    (a mensagem completa do commit) e como instalar.
      - name: Escrever resumo da build
        env:
          MENSAGEM: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "## O que mudou nesta build"
            echo
            echo "${MENSAGEM:-Compilação iniciada manualmente.}" | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:'
            echo
            echo "## Como instalar"
            echo
            echo "Baixe **CorAleatoria-apk** em *Artifacts* (abaixo), abra o .zip e toque em \`app-debug.apk\`."
          } >> "$GITHUB_STEP_SUMMARY"
